[extend]
useDefault = true

[[rules]]
id = "stellar-secret-key"
description = "Stellar private key"
regex = '''S[A-Z2-7]{55}'''
severity = "HIGH"

[[rules]]
id = "generic-api-token"
description = "Generic API token or key"
regex = '''(?i)(api[_-]?token|api[_-]?key)\s*[:=]\s*["']?[A-Za-z0-9\-_]{20,}["']?'''

[allowlist]
paths = [
  '''vendor/''',
  '''node_modules/''',
  '''\.test\.ts$''',
  '''\.spec\.ts$''',
  '''secrets/''',
]
regexes = [
  '''SCI7YTM2J5ZQOQ4SI5L5ZCXZDTXSMONGDFFHGQCPWAP6CCRBPYRCIATS''',
  '''GCRZUKNU2J5GLSYTZR4OLO7OBJJVHSMVBGG7IVUZU5FXMFHUDCLDGQJX''',
]
