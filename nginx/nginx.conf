# ---------------------------------------------------------------------------
# CarbonChain — Production Reverse Proxy (Cloudflare + Nginx) (#1374)
#
# Provides:
#   - Cloudflare CF-Connecting-IP real client IP restoration
#   - Tuned rate-limiting zones (limit_req_zone) & per-IP connection limits
#   - Slowloris mitigation via strict body/header/keepalive timeouts
#   - Buffer size limits to guard against oversized header/body floods
#   - Scraper & vulnerability-scanner User-Agent filtering
#   - TLS 1.2/1.3 cipher hardening & security headers
# ---------------------------------------------------------------------------

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Hide Nginx version in headers and error pages
    server_tokens off;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    # ── Cloudflare Real-IP Restoration ────────────────────────────────────────
    # Trust Cloudflare edge IPv4 & IPv6 ranges and extract original client IP
    # from CF-Connecting-IP so rate-limiting applies per visitor, not per edge.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header    CF-Connecting-IP;
    real_ip_recursive on;

    # ── Buffer Size Limits & Slowloris Mitigation ─────────────────────────────
    client_body_buffer_size     16k;
    client_header_buffer_size   1k;
    client_max_body_size        10m;
    large_client_header_buffers 4 8k;

    client_body_timeout   10s;
    client_header_timeout 10s;
    keepalive_timeout     15s;
    send_timeout          10s;
    reset_timedout_connection on;

    # ── Rate Limiting & Connection Limiting Zones ─────────────────────────────
    # General API traffic: 30 req/s per IP
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
    # Auth / SEP-10 challenge endpoints: strict 5 req/min per IP
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/m;
    # State-mutating / retirement endpoints: 10 req/s per IP
    limit_req_zone $binary_remote_addr zone=api_write:10m rate=10r/s;
    # Static frontend assets: 60 req/s per IP
    limit_req_zone $binary_remote_addr zone=static_assets:10m rate=60r/s;
    # Concurrent connections per IP
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

    limit_req_status  429;
    limit_conn_status 429;

    # ── Scraper & Scanner User-Agent Blocking ─────────────────────────────────
    map $http_user_agent $is_bad_bot {
        default 0;
        ~*(?:sqlmap|nikto|nmap|masscan|zgrab|gobuster|dirbuster|wpscan|acunetix|nessus) 1;
        ~*(?:scrapy|python-requests|go-http-client|libwww-perl|curl/|wget/) 1;
        "" 1;
    }

    # ── Upstreams ─────────────────────────────────────────────────────────────
    upstream api_backend {
        server api:3000;
        keepalive 32;
    }

    upstream frontend_backend {
        server frontend:80;
        keepalive 16;
    }

    # ── HTTP Server (Healthcheck + Redirect to HTTPS) ─────────────────────────
    server {
        listen 80;
        server_name _;

        # Docker / load-balancer healthcheck endpoint
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS Reverse Proxy Server ────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name _;

        # TLS Certificates (mount real certs or Cloudflare Origin CA certs)
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # SSL Cipher Hardening (Mozilla Intermediate / Modern)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        # Security headers (HSTS, CSP, X-Frame-Options, etc.)
        include /etc/nginx/security-headers.conf;

        # Limit concurrent connections per client IP
        limit_conn conn_limit_per_ip 20;

        # Block known scraper/scanner user agents
        if ($is_bad_bot) {
            return 403;
        }

        # Block hidden files (except /.well-known/) and source maps
        location ~ /\.(?!well-known) {
            deny all;
            return 404;
        }
        location ~* \.map$ {
            return 404;
        }

        # Strict rate limit for authentication / SEP-10 challenge endpoints
        location /api/auth/ {
            limit_req zone=api_auth burst=5 nodelay;

            proxy_pass http://api_backend/api/auth/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout    15s;
            proxy_read_timeout    30s;
        }

        # Write-heavy / retirement endpoints
        location ~ ^/api/(credits|retire|marketplace|orders) {
            limit_req zone=api_write burst=20 nodelay;

            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    60s;
        }

        # General API proxy
        location /api/ {
            limit_req zone=api_general burst=40 nodelay;

            proxy_pass http://api_backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    60s;
        }

        # Angular SPA frontend
        location / {
            limit_req zone=static_assets burst=80 nodelay;

            proxy_pass http://frontend_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
