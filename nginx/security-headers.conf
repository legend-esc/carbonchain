# ---------------------------------------------------------------------------
# CarbonChain — Nginx Security Headers (#1374)
#
# Included by server/location blocks in nginx/nginx.conf.
# Note: in Nginx, an `add_header` directive inside a `location` block
# overrides all `add_header` directives inherited from `server`/`http`, so
# any location that defines its own `add_header` should re-include this file.
# ---------------------------------------------------------------------------

# Enforce HTTPS for 2 years including subdomains (HSTS preload-ready)
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# Prevent clickjacking by disallowing framing
add_header X-Frame-Options "DENY" always;

# Prevent MIME-type sniffing
add_header X-Content-Type-Options "nosniff" always;

# Legacy XSS filter for older browsers
add_header X-XSS-Protection "1; mode=block" always;

# Limit referrer leakage across origins
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Restrict browser hardware/sensor features
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

# Content Security Policy tailored for Angular SPA + Stellar Horizon/Soroban
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://horizon-testnet.stellar.org https://horizon.stellar.org https://soroban-testnet.stellar.org https://soroban.stellar.org; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
