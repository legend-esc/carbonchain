version: 2
updates:
  # Soroban / Rust contracts
  - package-ecosystem: "cargo"
    directory: "/contracts"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    reviewers:
      - "carbonchain/maintainers"
    labels:
      - "dependencies"
      - "infrastructure"
      - "security"

  # NestJS API
  - package-ecosystem: "npm"
    directory: "/api"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    reviewers:
      - "carbonchain/maintainers"
    labels:
      - "dependencies"
      - "infrastructure"
      - "security"

  # Angular frontend
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    reviewers:
      - "carbonchain/maintainers"
    labels:
      - "dependencies"
      - "infrastructure"
      - "security"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    reviewers:
      - "carbonchain/maintainers"
    labels:
      - "dependencies"
      - "infrastructure"
