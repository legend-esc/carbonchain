name: Soroban Gas Benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'scripts/compare-gas-benchmarks.py'
      - '.github/workflows/gas-benchmark.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  gas-benchmark:
    name: Compare Soroban Gas & Budget
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: head

      - name: Checkout base branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.base_ref || 'main' }}
          path: base

      - name: Install Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master (1.91.0)
        with:
          toolchain: "1.91.0"
          targets: wasm32v1-none

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('head/contracts/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-

      - name: Run benchmarks on base branch
        run: |
          set -o pipefail
          cd base/contracts
          cargo test --workspace -- --nocapture 2>&1 | tee ../../base-bench.txt || true

      - name: Run benchmarks on PR branch
        run: |
          set -o pipefail
          cd head/contracts
          cargo test --workspace -- --nocapture 2>&1 | tee ../../head-bench.txt || true

      - name: Compare gas benchmarks
        run: |
          python3 head/scripts/compare-gas-benchmarks.py \
            --base base-bench.txt \
            --head head-bench.txt \
            --output gas-report.md

      - name: Post PR benchmark comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            const { readFileSync } = require('fs');
            const body = readFileSync('gas-report.md', 'utf8');
            const marker = '<!-- gas-benchmark-report -->';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Upload benchmark report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gas-benchmark-report
          path: gas-report.md
          retention-days: 7
