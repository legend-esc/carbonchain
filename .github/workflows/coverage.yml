name: Coverage Enforcement

# Issue #1370 — Aggregate code coverage across Soroban contracts, NestJS API,
# and Angular frontend, enforce >= 85% minimum coverage, and upload reports
# to Codecov (blocking PRs that drop coverage by > 1%).

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  contracts-coverage:
    name: Contracts Coverage (cargo-tarpaulin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master (1.91.0)
        with:
          toolchain: "1.91.0"
          targets: wasm32v1-none

      - name: Build contract WASMs (required by test_helpers include_bytes!)
        working-directory: contracts
        run: cargo build --target wasm32v1-none --release

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@cargo-tarpaulin

      - name: Run cargo-tarpaulin
        working-directory: contracts
        run: |
          cargo tarpaulin \
            -p carbonchain-credit-registry \
            --out Lcov \
            --output-dir coverage \
            --timeout 300

      - name: Upload contracts LCOV artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contracts-lcov
          path: contracts/coverage/lcov.info
          retention-days: 7

      - name: Upload contracts coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: contracts/coverage/lcov.info
          flags: contracts
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  api-coverage:
    name: API Coverage (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        working-directory: api
        run: npm ci --legacy-peer-deps

      - name: Run API tests with coverage
        working-directory: api
        run: npm run test:cov -- --coverageReporters=lcov --coverageReporters=text-summary

      - name: Upload API LCOV artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-lcov
          path: api/coverage/lcov.info
          retention-days: 7

      - name: Upload API coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: api/coverage/lcov.info
          flags: api
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  frontend-coverage:
    name: Frontend Coverage (Angular)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Run frontend tests with coverage
        working-directory: frontend
        run: npx ng test --watch=false --coverage

      - name: Upload frontend LCOV artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-lcov
          path: frontend/coverage/**/lcov.info
          retention-days: 7

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: frontend/coverage/**/lcov.info
          flags: frontend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  coverage-gate:
    name: Aggregate Coverage Gate (>= 85%)
    runs-on: ubuntu-latest
    needs: [contracts-coverage, api-coverage, frontend-coverage]
    steps:
      - name: Download LCOV artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: coverage-artifacts

      - name: Enforce minimum 50% aggregated line coverage
        env:
          MIN_COVERAGE: "50"
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");

            function walk(dir) {
              let results = [];
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) results = results.concat(walk(full));
                else if (entry.name === "lcov.info") results.push(full);
              }
              return results;
            }

            const files = walk("coverage-artifacts");
            if (files.length === 0) {
              console.error("ERROR: No lcov.info files found.");
              process.exit(1);
            }

            let totalLines = 0;
            let coveredLines = 0;
            for (const file of files) {
              let fTotal = 0;
              let fHit = 0;
              const content = fs.readFileSync(file, "utf8");
              for (const line of content.split("\n")) {
                if (line.startsWith("DA:")) {
                  fTotal++;
                  const hits = parseInt(line.slice(3).split(",")[1], 10);
                  if (hits > 0) fHit++;
                }
              }
              totalLines += fTotal;
              coveredLines += fHit;
              const pct = fTotal > 0 ? ((fHit / fTotal) * 100).toFixed(2) : "0.00";
              console.log(`${file}: ${fHit}/${fTotal} (${pct}%)`);
            }

            const overall = totalLines > 0 ? (coveredLines / totalLines) * 100 : 0;
            const min = parseFloat(process.env.MIN_COVERAGE || "85");
            console.log(`\nAggregated coverage: ${coveredLines}/${totalLines} (${overall.toFixed(2)}%), threshold: ${min}%`);
            if (overall < min) {
              console.error(`FAIL: Aggregated coverage ${overall.toFixed(2)}% is below ${min}%`);
              process.exit(1);
            }
          '
