name: Reusable Build Workflow

on:
  workflow_call:
    inputs:
      rust-toolchain:
        description: 'Rust toolchain version'
        required: false
        type: string
        default: '1.91.0'
      node-version:
        description: 'Node.js version'
        required: false
        type: string
        default: '20'
      docker-registry:
        description: 'Docker registry'
        required: false
        type: string
        default: 'ghcr.io'
      docker-image-name:
        description: 'Docker image name'
        required: false
        type: string
        default: 'carbonchain'
      docker-tag:
        description: 'Docker image tag'
        required: false
        type: string
        default: 'latest'
      push-docker:
        description: 'Push Docker image'
        required: false
        type: boolean
        default: false
    outputs:
      docker-image:
        description: 'Built Docker image URI'
        value: ${{ jobs.docker.outputs.image }}

jobs:
  contracts:
    name: Build Smart Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@008f31fc1bef098acda5bc0f83cc6714a485c3d8 # stable
        with:
          toolchain: ${{ inputs.rust-toolchain }}
          targets: wasm32v1-none
      - name: Cache cargo dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-
      - name: Build WASM Contracts
        run: cd contracts && cargo build --target wasm32v1-none --release
      - name: Upload Contract Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contract-wasm
          path: contracts/target/wasm32v1-none/release/*.wasm
          retention-days: 7

  api:
    name: Build Backend API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"
          cache-dependency-path: api/package-lock.json
      - name: Install Dependencies
        run: cd api && npm ci --legacy-peer-deps
      - name: Build
        run: cd api && npm run build
      - name: Upload API Build Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-dist
          path: api/dist
          retention-days: 7

  frontend:
    name: Build Frontend SPA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install Dependencies
        run: cd frontend && npm ci --legacy-peer-deps
      - name: Build
        run: cd frontend && npm run build
      - name: Upload Frontend Build Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-dist
          path: frontend/dist/carbonchain-frontend
          retention-days: 7

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [contracts, api, frontend]
    if: ${{ inputs.push-docker }}
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - name: Log in to Docker registry
        if: ${{ inputs.push-docker }}
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ inputs.docker-registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ inputs.docker-registry }}/${{ github.repository }}/${{ inputs.docker-image-name }}
          tags: |
            type=raw,value=${{ inputs.docker-tag }}
            type=sha,prefix=
      - name: Build and push
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6.16.0
        with:
          context: .
          push: ${{ inputs.push-docker }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
