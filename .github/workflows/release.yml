name: Release & Changelog

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_as:
        description: "Force a specific semver bump (leave 'auto' to infer from conventional commits)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      dry_run:
        description: "Run standard-version in dry-run mode without pushing tags or creating a release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Automated Semantic Release
    runs-on: ubuntu-latest
    # Prevent infinite loops on automated release commits
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run standard-version
        id: release
        run: |
          set -euo pipefail
          ARGS=()
          RELEASE_AS="${{ github.event.inputs.release_as || 'auto' }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"

          if [ "$RELEASE_AS" != "auto" ]; then
            ARGS+=(--release-as "$RELEASE_AS")
          fi
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi

          # Use npx so the workflow works even before root node_modules are installed
          npx --yes standard-version@9 "${ARGS[@]}"

          NEW_VERSION=$(node -p "require('./package.json').version")
          NEW_TAG="v${NEW_VERSION}"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
          echo "Computed release tag: ${NEW_TAG}"

      - name: Push release commit and tag
        if: github.event.inputs.dry_run != 'true'
        run: |
          git push --follow-tags origin main

      - name: Create GitHub Release
        if: github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; skipping."
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes
          fi
