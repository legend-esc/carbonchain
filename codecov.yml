# Codecov configuration for CarbonChain (#1370)
# Enforces >= 85% coverage and blocks PRs that drop coverage by more than 1%.

codecov:
  require_ci_to_pass: true
  notify:
    wait_for_ci: true

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: 85%
        threshold: 1%
        if_ci_failed: error
      contracts:
        flags:
          - contracts
        target: 85%
        threshold: 1%
      api:
        flags:
          - api
        target: 85%
        threshold: 1%
      frontend:
        flags:
          - frontend
        target: 85%
        threshold: 1%

    patch:
      default:
        target: 85%
        threshold: 1%
        if_ci_failed: error

flags:
  contracts:
    paths:
      - contracts/
    carryforward: true
  api:
    paths:
      - api/src/
    carryforward: true
  frontend:
    paths:
      - frontend/src/
    carryforward: true

comment:
  layout: "reach,diff,flags,tree,footer"
  behavior: default
  require_changes: false

ignore:
  - "**/*.spec.ts"
  - "**/*.test.ts"
  - "**/test/**"
  - "**/tests/**"
  - "**/__mocks__/**"
  - "api/src/migrations/**"
  - "scripts/**"
  - "dist/**"
  - "coverage/**"
