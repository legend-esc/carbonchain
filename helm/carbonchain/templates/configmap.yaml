apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "carbonchain.fullname" . }}-config
  labels:
    {{- include "carbonchain.labels" . | nindent 4 }}
data:
  {{- range $key, $val := .Values.config }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
  {{- if .Values.redisSentinel.enabled }}
  REDIS_SENTINEL_HOSTS: {{ include "carbonchain.redisSentinelHosts" . | quote }}
  {{- end }}
