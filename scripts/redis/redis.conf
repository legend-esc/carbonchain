# CarbonChain Redis master configuration (#975)
#
# This file is mounted read-only into the `redis` service. It deliberately
# enables persistence so that state which callers depend on for correctness is
# not silently dropped when the container/pod restarts:
#
#   * idempotency records   (idempotency:<sha256(Idempotency-Key)>)
#   * revoked JWT ids       (revoked_tokens / revoked_tokens:ttl:<jti>)
#   * nonce reservations    (nonce:<address>:<nonce>)
#   * webhook cache snapshot (webhooks:registry / webhooks:deliveries / queue)
#
# See docs/ops/redis-ha.md for the durability tradeoff versus the
# PostgreSQL-backed webhook store (issue #54).

# ── Durability ────────────────────────────────────────────────────────────────
# AOF is the primary durability mechanism: every write is appended to the
# append-only file and fsynced once per second. At most one second of writes can
# be lost on a hard crash; a graceful restart loses nothing.
appendonly yes
appendfsync everysec
appendfilename "appendonly.aof"
aof-use-rdb-preamble yes

# RDB snapshots are kept as compact point-in-time backups and to make AOF
# rewrites cheaper.
save 60 1
save 300 10
save 900 1

# Both the AOF and the RDB snapshot live on the `redis_data` named volume so
# they survive container recreation.
dir /data

# ── Networking / access ───────────────────────────────────────────────────────
bind 0.0.0.0
protected-mode yes

# ── Authentication / ACL ──────────────────────────────────────────────────────
# The ACL file is generated at container start from REDIS_PASSWORD by
# scripts/redis/redis-entrypoint.sh and lives on the persisted `redis_data`
# volume. Keeping the credential in a single env var guarantees that Redis and
# the API (`REDIS_URL`) always agree.
aclfile /data/users.acl
