version: '3.9'

# ---------------------------------------------------------------------------
# CarbonChain — local development stack
#
# Services:
#   postgres         — PostgreSQL 16 master (off-chain read index)
#   postgres-replica — PostgreSQL 16 streaming read replica (#559)
#   redis            — Redis 7 (API response cache + rate-limit store)
#   api              — NestJS REST API (port 3000)
#   frontend         — Angular SPA served by nginx (port 4200)
#
# Quick start:
#   docker compose up -d
#   docker compose logs -f api
# ---------------------------------------------------------------------------

services:

  # ── PostgreSQL (master) ────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Enable pg_stat_statements for slow-query monitoring (see scripts/slow-queries.sql).
    # To activate, uncomment the line below:
    # command: postgres -c shared_preload_libraries=pg_stat_statements
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c hot_standby=on
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: carbonchain
      # #559 — password for the `replicator` role created by init-replication.sh,
      # used by postgres-replica to stream from this instance.
      REPLICATION_PASSWORD: replicator_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres/init-replication.sh:/docker-entrypoint-initdb.d/init-replication.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d carbonchain"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── PostgreSQL (streaming read replica) ────────────────────────────────────
  # #559 — read-scaling replica. Clones `postgres` via pg_basebackup on first
  # start and follows it via streaming replication thereafter. The API routes
  # reads from endpoints marked @UseReplicaForRead() here (see
  # api/src/data-source.ts DATABASE_REPLICA_URLS); all writes and critical
  # post-write reads go to the master.
  postgres-replica:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/docker-entrypoint-replica.sh"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: carbonchain
      PGDATA: /var/lib/postgresql/data/pgdata
      PRIMARY_HOST: postgres
      REPLICATION_PASSWORD: replicator_password
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ./scripts/postgres/replica-entrypoint.sh:/docker-entrypoint-replica.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d carbonchain"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── NestJS API ─────────────────────────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./api/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/carbonchain
      # #559 — route reads from @UseReplicaForRead() endpoints here.
      DATABASE_REPLICA_URLS: postgresql://postgres:postgres@postgres-replica:5432/carbonchain
      REDIS_URL: redis://redis:6379
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Angular Frontend ───────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
  postgres_replica_data:
  redis_data:
