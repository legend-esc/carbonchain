version: '3.9'

# ---------------------------------------------------------------------------
# CarbonChain — local development stack
#
# Services:
#   postgres   — PostgreSQL 16 (off-chain read index)
#   redis      — Redis 7 (API response cache + rate-limit store)
#   api        — NestJS REST API (port 3000)
#   frontend   — Angular SPA served by nginx (port 4200)
#
# Quick start:
#   docker compose up -d
#   docker compose logs -f api
# ---------------------------------------------------------------------------

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Enable pg_stat_statements for slow-query monitoring (see scripts/slow-queries.sql).
    # To activate, uncomment the line below:
    # command: postgres -c shared_preload_libraries=pg_stat_statements
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: carbonchain
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d carbonchain"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Redis Master ───────────────────────────────────────────────────────────
  # Primary Redis node. Sentinels monitor this instance and promote a replica
  # automatically if the master becomes unreachable.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── Redis Replica 1 ────────────────────────────────────────────────────────
  redis-replica-1:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --replicaof redis 6379 --loglevel warning
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Redis Replica 2 ────────────────────────────────────────────────────────
  redis-replica-2:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --replicaof redis 6379 --loglevel warning
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Redis Sentinel 1 ───────────────────────────────────────────────────────
  # Three sentinel instances provide a quorum of 2 — the minimum required to
  # agree on a failover before promoting a new master.
  redis-sentinel-1:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      sh -c "
        echo 'sentinel monitor mymaster redis 6379 2' > /tmp/sentinel.conf &&
        echo 'sentinel down-after-milliseconds mymaster 5000' >> /tmp/sentinel.conf &&
        echo 'sentinel failover-timeout mymaster 10000' >> /tmp/sentinel.conf &&
        echo 'sentinel parallel-syncs mymaster 1' >> /tmp/sentinel.conf &&
        redis-sentinel /tmp/sentinel.conf
      "
    ports:
      - "26379:26379"
    depends_on:
      redis:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Redis Sentinel 2 ───────────────────────────────────────────────────────
  redis-sentinel-2:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      sh -c "
        echo 'sentinel monitor mymaster redis 6379 2' > /tmp/sentinel.conf &&
        echo 'sentinel down-after-milliseconds mymaster 5000' >> /tmp/sentinel.conf &&
        echo 'sentinel failover-timeout mymaster 10000' >> /tmp/sentinel.conf &&
        echo 'sentinel parallel-syncs mymaster 1' >> /tmp/sentinel.conf &&
        redis-sentinel /tmp/sentinel.conf
      "
    ports:
      - "26380:26379"
    depends_on:
      redis:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Redis Sentinel 3 ───────────────────────────────────────────────────────
  redis-sentinel-3:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      sh -c "
        echo 'sentinel monitor mymaster redis 6379 2' > /tmp/sentinel.conf &&
        echo 'sentinel down-after-milliseconds mymaster 5000' >> /tmp/sentinel.conf &&
        echo 'sentinel failover-timeout mymaster 10000' >> /tmp/sentinel.conf &&
        echo 'sentinel parallel-syncs mymaster 1' >> /tmp/sentinel.conf &&
        redis-sentinel /tmp/sentinel.conf
      "
    ports:
      - "26381:26379"
    depends_on:
      redis:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── NestJS API ─────────────────────────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./api/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/carbonchain
      # Sentinel-aware connection string. The API's CacheService reads this and
      # uses ioredis Sentinel mode when REDIS_SENTINEL_HOSTS is set.
      # Format: sentinel://<sentinel-host>:<port>,<sentinel-host>:<port>,.../<master-name>
      REDIS_URL: redis://redis:6379
      REDIS_SENTINEL_HOSTS: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      REDIS_SENTINEL_NAME: mymaster
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_healthy
      redis-sentinel-2:
        condition: service_healthy
      redis-sentinel-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Angular Frontend ───────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
