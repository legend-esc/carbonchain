server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests to the NestJS service
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Issue #543: Block public access to source map files.
    # Source maps are uploaded to Sentry during CI and must not be
    # served to end-users (they expose original TypeScript source).
    location ~* \.map$ {
        return 404;
    }

    # Angular SPA — serve index.html for all non-asset routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
