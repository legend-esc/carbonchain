<!-- Issue #1333 — offline detection banner (replaces the old inline div) -->
<app-offline-banner />

<header class="app-header">
  <span class="logo">🌿 CarbonChain</span>
  <nav>
    <a routerLink="/dashboard">{{ 'nav.dashboard' | translate }}</a>
    <a routerLink="/marketplace">{{ 'nav.marketplace' | translate }}</a>
    <a routerLink="/retire">{{ 'nav.retire' | translate }}</a>
    <a routerLink="/admin">Admin</a>
  </nav>
  <app-network-indicator />
  <!-- Issue #1334 — currency selector: all prices reformat app-wide -->
  <app-currency-selector />
  <app-locale-switcher />
  <button
    class="theme-toggle"
    (click)="theme.toggle()"
    [attr.aria-label]="theme.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
  >
    {{ theme.icon() }}
  </button>
  <app-connect-wallet [compact]="true" />
</header>

<main>
  <app-breadcrumbs />
  <router-outlet />
</main>

<!-- Issue #1336 — rich toast container with txHash explorer links -->
<app-toast-container />
<!-- Keep legacy ToastComponent until all callers are migrated -->
<app-toast />
<app-install-prompt />
<app-tx-status-modal />
