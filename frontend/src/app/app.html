@if (!onlineStatus.online()) {
  <div class="offline-banner" role="status">{{ 'app.offlineBanner' | translate }}</div>
}

<header class="app-header">
  <span class="logo">🌿 CarbonChain</span>
  <nav>
    <a routerLink="/dashboard">{{ 'nav.dashboard' | translate }}</a>
    <a routerLink="/marketplace">{{ 'nav.marketplace' | translate }}</a>
    <a routerLink="/retire">{{ 'nav.retire' | translate }}</a>
    <a routerLink="/admin">{{ 'app.nav.admin' | translate }}</a>
  </nav>
  <app-network-indicator />
  <app-locale-switcher />
  <button
    class="theme-toggle"
    (click)="theme.toggle()"
    [attr.aria-label]="(theme.isDark() ? 'app.theme.toLight' : 'app.theme.toDark') | translate"
  >
    {{ theme.icon() }}
  </button>
  <app-connect-wallet [compact]="true" />
</header>

<main>
  <router-outlet />
</main>

<app-toast />
<app-install-prompt />
